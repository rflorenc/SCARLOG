# Edit to control which approaches to run

# Globals
reasoning_enhancements:
  self_consistency:
    enabled: true
    num_samples: 3
    temperature: 0.6
    
  verifier_feedback:
    enabled: true
    use_same_model: true
    verifier_temperature: 0.2  # Lower for more consistent verification
  
  sampling:
    # 6 total samples
    target_anomalies: 3
    target_normals: 3

  cross_validation_inference:
      enabled: false  # toggle multi-perspective CV
      perspectives:
        eventtraces:
          - name: "distributed_systems_expert"
            weight: 0.35
            focus: "system behavior patterns, distributed protocols, consistency violations"
          - name: "system_administrator"
            weight: 0.25
            focus: "operational issues, resource problems, system health"
          - name: "cybersecurity_analyst"
            weight: 0.40
            focus: "security threats, intrusion patterns, abnormal access"
        bgl:
          - name: "hpc_systems_expert"
            weight: 0.40
            focus: "supercomputer behavior, job scheduling, resource allocation"
          - name: "systems_engineer"
            weight: 0.35
            focus: "hardware issues, system failures, performance degradation"
          - name: "operations_specialist"
            weight: 0.25
            focus: "operational anomalies, maintenance indicators, system health"
        assuremoss:
          - name: "kubernetes_security_expert"
            weight: 0.45
            focus: "container security, pod behavior, cluster anomalies"
          - name: "cloud_security_architect"
            weight: 0.35
            focus: "microservice patterns, service mesh security, data flows"
          - name: "devsecops_engineer"
            weight: 0.20
            focus: "CI/CD security, deployment anomalies, configuration issues"
        unsw-nb15:
          - name: "network_security_expert"
            weight: 0.40
            focus: "attack signatures, malicious traffic, protocol violations"
          - name: "network_administrator"
            weight: 0.30
            focus: "network performance, legitimate services, traffic patterns"
          - name: "threat_hunter"
            weight: 0.30
            focus: "advanced threats, evasion techniques, lateral movement"
      temperature: 0.6  # Temperature for cross-validation predictions
      aggregation: "weighted_vote"  # Options: weighted_vote, majority_vote, confidence_weighted

rag_evaluation:
  enabled: false  # Toggle RAG
  top_k: 3       # Nr of similar examples to get

approaches:
  # Small models (1.5B-3B parameters)
  - name: "Granite_3.2-2b-instruct"
    type: "llm"
    model_name: "ibm-granite/granite-3.2-2b-instruct"
    enabled: true
    # backend: "local_transformers"  # Default, can be omitted
    
  - name: "Llama-3.2-3B-Instruct"
    type: "llm"
    model_name: "meta-llama/Llama-3.2-3B-Instruct"
    enabled: true
    # backend: "local_transformers"  # Default, can be omitted

  - name: "OpenReasoning-Nemotron-1.5B"
    type: "llm"
    model_name: "nvidia/OpenReasoning-Nemotron-1.5B"
    enabled: true

  # https://huggingface.co/deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B#usage-recommendations
  - name: "DeepSeek-R1-Distill-Qwen-1.5B"
    type: "llm"
    model_name: "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"
    enabled: true
    
  - name: "Hymba-1.5B-Instruct"
    type: "llm"
    model_name: "nvidia/Hymba-1.5B-Instruct"
    enabled: false  # Disabled - no corresponding 7/8B model

  - name: SmolLM2-1.7B-Instruct
    type: "llm"
    model_name: "HuggingFaceTB/SmolLM2-1.7B-Instruct"
    enabled: false  # Disabled - no corresponding 7/8B model
    
  # Large models (7B-8B parameters)
  - name: "DeepSeek-R1-Distill-Qwen-7B"
    type: "llm"
    model_name: "deepseek-ai/DeepSeek-R1-Distill-Qwen-7B"
    enabled: true
    # backend: "vllm"  # Optional: use vLLM for large models
    
  - name: "Mistral-7B-Instruct-v0.3"
    type: "llm"
    model_name: "mistralai/Mistral-7B-Instruct-v0.3"
    enabled: true
    # backend: "vllm"  # Optional: use vLLM for large models
    
  - name: "Granite_3.2_8B-instruct"
    type: "llm"
    model_name: "ibm-granite/granite-3.2-8b-instruct"
    enabled: true
    #backend: "vllm"  # Example: explicitly use vLLM for this model
    
  - name: "Llama-3.1-8B-Instruct"
    type: "llm"
    model_name: "meta-llama/Llama-3.1-8B-Instruct"
    enabled: true
    
  - name: "DeepSeek-R1-Distill-Llama-8B"
    type: "llm"
    model_name: "deepseek-ai/DeepSeek-R1-Distill-Llama-8B"
    enabled: true

  - name: "OpenReasoning-Nemotron-7B"
    type: "llm"
    model_name: "nvidia/OpenReasoning-Nemotron-7B"
    enabled: true


test_configs:
  test:
    - "Granite_3.2-2b-instruct"
    - "DeepSeek-R1-Distill-Qwen-1.5B"
  
  test_single:
    - "DeepSeek-R1-Distill-Qwen-1.5B"
    #- "Granite_3.2-2b-instruct"

  test_openreasoning:
    - "OpenReasoning-Nemotron-1.5B"
    #- "OpenReasoning-Nemotron-7B"

  small_models:
    - "Granite_3.2-2b-instruct"
    - "Llama-3.2-3B-Instruct"
    - "DeepSeek-R1-Distill-Qwen-1.5B"
    - "SmolLM2-1.7B-Instruct"
  
  large_models:
    - "DeepSeek-R1-Distill-Qwen-7B"
    - "Mistral-7B-Instruct-v0.3"
    - "Granite_3.2_8B-instruct"
    - "Llama-3.1-8B-Instruct"
    - "DeepSeek-R1-Distill-Llama-8B"

  all_models:
      - "DeepSeek-R1-Distill-Qwen-1.5B"
      - "OpenReasoning-Nemotron-1.5B"
      - "Hymba-1.5B-Instruct"
      - "SmolLM2-1.7B-Instruct"
      - "Granite_3.2-2b-instruct"
      - "Llama-3.2-3B-Instruct"
      - "DeepSeek-R1-Distill-Qwen-7B"
      - "Mistral-7B-Instruct-v0.3"
      - "Granite_3.2_8B-instruct"
      - "Llama-3.1-8B-Instruct"
      - "DeepSeek-R1-Distill-Llama-8B"
      - "OpenReasoning-Nemotron-7B"